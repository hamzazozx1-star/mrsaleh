<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journey: Choice System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function ChoiceSystemMockup() {
            const choices = [
                { title: 'تهرب', color: 'from-red-500 to-red-800', result: 'مطاردة شرطة عالية الخطورة', icon: '🏃' },
                { title: 'تطلع الباسبور المزور', color: 'from-yellow-400 to-orange-700', result: 'دخول مؤقت لكن فيه شك', icon: '🪪' },
                { title: 'تخلى ليلى تتكلم', color: 'from-cyan-400 to-blue-800', result: 'يعتمد على علاقتك بيها', icon: '🗣️' },
                { title: 'ضعف', color: 'from-gray-400 to-gray-800', result: 'توتر وخوف يغير الأحداث', icon: '💔' }
            ];

            return (
                <div className="min-h-screen bg-black text-white overflow-hidden relative flex items-center justify-center p-6 font-sans">
                    {/* Background */}
                    <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(255,215,0,0.08),transparent_50%)]" />
                    {/* Cinematic overlay */}
                    <div className="absolute inset-0 bg-gradient-to-b from-black/80 via-transparent to-black/90" />

                    <div className="relative z-10 w-full max-w-6xl">
                        <div className="mb-10 text-center">
                            <p className="text-yellow-400 tracking-[0.5em] text-sm uppercase mb-3">Decision Moment</p>
                            <h1 className="text-5xl md:text-6xl font-black mb-4">نقطة اللاعودة</h1>
                            <p className="text-zinc-400 text-lg max-w-2xl mx-auto leading-relaxed">
                                الشرطة بدأت تشك في هويتكم داخل المطار. <br /> القرار القادم قد يغير مصير الرحلة بالكامل.
                            </p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {choices.map((choice, index) => (
                                <button key={index} className="group relative overflow-hidden rounded-3xl border border-white/10 bg-white/5 backdrop-blur-md p-7 text-right transition-all duration-300 hover:scale-[1.03] hover:border-yellow-400/50 hover:shadow-2xl hover:shadow-yellow-500/20">
                                    <div className={`absolute inset-0 opacity-0 group-hover:opacity-20 transition duration-500 bg-gradient-to-br ${choice.color}`} />
                                    <div className="relative z-10 flex items-start gap-5">
                                        <div className="text-5xl">{choice.icon}</div>
                                        <div className="flex-1">
                                            <div className="flex items-center justify-between mb-3">
                                                <h2 className="text-2xl font-bold">{choice.title}</h2>
                                                <span className="text-xs px-3 py-1 rounded-full bg-white/10 text-zinc-300 border border-white/10">اختيار مصيري</span>
                                            </div>
                                            <p className="text-zinc-400 leading-relaxed mb-5">{choice.result}</p>
                                            <div className="flex items-center justify-between">
                                                <div className="w-full bg-white/10 rounded-full h-1.5 overflow-hidden">
                                                    <div className={`h-full bg-gradient-to-r ${choice.color} w-2/3`} />
                                                </div>
                                                <span className="ml-4 text-yellow-400 text-sm tracking-widest uppercase">Choose</span>
                                            </div>
                                        </div>
                                    </div>
                                </button>
                            ))}
                        </div>
                        <div className="mt-10 text-center text-zinc-500 text-sm tracking-widest">كل اختيار يغير العلاقات • الأحداث • النهايات</div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ChoiceSystemMockup />);
    </script>
</body>
</html>
